name: rtc_erp
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Core
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.0
  go_router: ^17.0.1
  equatable: ^2.0.8
  injectable: ^2.7.1+4
  permission_handler: ^12.0.1

  # Network
  dio: ^5.9.0
  retrofit: ^4.5.0
  freezed_annotation: ^2.4.1
  dio_cache_interceptor: ^4.0.5

  # JSON
  json_annotation: ^4.9.0

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.2

  # Storage
  shared_preferences: ^2.5.4

  # Logging
  logger: ^2.6.2

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  firebase_messaging: ^16.1.1
  firebase_analytics: ^12.1.1
  firebase_crashlytics: ^5.0.7

  # UI
  flutter_svg: ^2.2.3
  flutter_screenutil: ^5.9.3
  fluttertoast: ^9.0.0
  device_info_plus: ^12.3.0
  easy_localization: ^3.0.8
  top_snackbar_flutter: ^3.3.0

  # Env
  flutter_dotenv: ^6.0.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Third Package
  timezone: ^0.9.0
  flutter_timezone: ^5.0.1
  flutter_local_notifications: ^17.1.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  persistent_bottom_nav_bar: ^6.2.1
  rename: ^3.1.0
  like_button: ^2.1.0

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/icons/logo/logo_splash.png

  android: true
  ios: true

  android_12:
    image: assets/images/icons/logo/logo_splash.png
    color: "#FFFFFF"


flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/icons/logo/logo_app.png

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  very_good_analysis: ^10.0.0

  # Codegen
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  hive_generator: ^2.0.1

flutter:

  uses-material-design: true
  assets:
    # ENV
    - assets/env/.env.debug
    - assets/env/.env.staging
    - assets/env/.env.production

    # Images
    - assets/images/icons/logo/logo_app.png
    - assets/images/icons/logo/logo_splash.png


    # Trans
    - assets/trans/vi-VN.json
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
