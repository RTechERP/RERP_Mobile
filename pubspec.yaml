name: rtc_erp
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+24

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Core
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.0
  go_router: ^17.0.1
  equatable: ^2.0.8
  injectable: ^2.7.1+4
  permission_handler: ^12.0.1
  webview_flutter: ^4.10.0

  # Network
  dio: ^5.4.3
  freezed_annotation: ^2.4.1
  dio_cache_interceptor: ^4.0.5

  # JSON
  json_annotation: ^4.9.0

  # Utils
  intl: ^0.20.2

  # Storage
  shared_preferences: ^2.5.4

  # Logging
  logger: ^2.6.2

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  firebase_messaging: ^16.1.1
  firebase_analytics: ^12.1.1
  firebase_crashlytics: ^5.0.7

  # UI
  flutter_svg: ^2.2.3
  flutter_screenutil: ^5.9.3
  fluttertoast: ^9.0.0
  device_info_plus: ^12.3.0
  easy_localization: ^3.0.8
  top_snackbar_flutter: ^3.3.0
  pinput: ^5.0.0

  # Env
  flutter_dotenv: ^6.0.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Third Package
  timezone: ^0.11.0
  flutter_timezone: ^5.0.1
  flutter_local_notifications: ^22.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  persistent_bottom_nav_bar: ^6.2.1
  rename: ^3.1.0
  like_button: ^2.1.0
  flutter_slidable: ^4.0.3
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0
  file_picker: ^10.3.10
  file_saver: ^0.2.14
  image_picker: ^1.1.2
  form_builder_file_picker: ^5.0.0
  skeletonizer: ^2.1.2
  wolt_modal_sheet: ^0.11.0
  dartz: ^0.10.1
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  lottie: ^3.3.2
  syncfusion_flutter_core: ^32.2.4
  syncfusion_flutter_datepicker: ^32.2.4
  syncfusion_flutter_calendar: ^32.2.4
  syncfusion_flutter_pdfviewer: ^32.2.4
  syncfusion_flutter_charts: ^32.2.4
  flutter_speed_dial: ^7.0.0
  smooth_sheets: ^1.0.0
  easy_stepper: ^1.0.1

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/icons/logo/logo_splash.png

  android: true
  ios: true

  android_12:
    image: assets/images/icons/logo/logo_splash_test.png
    color: "#FFFFFF"


flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/icons/logo/logo_app_test.png

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  very_good_analysis: ^10.0.0

