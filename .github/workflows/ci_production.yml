name: CI Production

on:
  push:
    branches: [ "main" ]

jobs:
  production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK (production)
        run: |
          flutter build apk \
            --flavor prod \
            -t lib/main_production.dart

      # OPTIONAL – upload artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: erp-production-apk
          path: build/app/outputs/flutter-apk/app-prod-release.apk
